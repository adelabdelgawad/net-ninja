[workspace]
members = ["src/backend", "src/app"]
resolver = "2"

[workspace.dependencies]
leptos = { version = "0.7", features = [] }
leptos_axum = { version = "0.7" }
leptos_meta = { version = "0.7" }
leptos_router = { version = "0.7" }
axum = { version = "0.7" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tower-sessions = { version = "0.13" }
tower-sessions-sqlx-store = { version = "0.14", features = ["sqlite"] }
argon2 = { version = "0.5" }
governor = { version = "0.6" }
dashmap = { version = "6" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "fmt", "env-filter"] }
http = "1.0"
uuid = { version = "1", features = ["v4"] }
